<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#f4f8fc;--card:#fff;--text:#1f2a37;--muted:#6b7785;--primary:#2f6fb5;--soft:#e6f0fa;--border:#dbe5ef;--error:#c0392b;--ok:#2e8b57;--warnbg:#fdf1d8;--warn:#8a5a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#root{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column}
.pad{padding:24px 20px;flex:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:12px;object-fit:contain;display:block;background:#fff}
.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:18px 0 10px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.5}
.steps{display:flex;gap:6px;margin-bottom:20px}.steps span{height:5px;flex:1;border-radius:3px;background:var(--border)}.steps span.on{background:var(--primary)}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;font:inherit;color:inherit;cursor:pointer}
.choice.sel{border-color:var(--primary);background:var(--soft)}.choice .ic{font-size:26px}.choice b{display:block;font-size:16px}.choice small{color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font:inherit;background:var(--card);color:var(--text)}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
input[type=file]{padding:9px;font-size:13px}
.btn{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--primary);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.small{margin-top:0;width:auto;padding:9px 16px;font-size:13px}
.btn.del{background:transparent;color:var(--error);border:1px solid var(--error)}
.btn.ghost{background:var(--soft);color:var(--primary)}
.link{background:none;border:0;color:var(--primary);font:inherit;margin-top:12px;cursor:pointer;padding:6px;align-self:flex-start}
.err{color:var(--error);font-size:13px;margin-top:8px;min-height:18px}.okmsg{color:var(--ok);font-size:13px;margin-top:8px}
.info{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0}
.tabs2{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:8px}
.tabs2 button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs2 button.on{background:var(--card);color:var(--primary)}
.otp{letter-spacing:8px;text-align:center;font-size:22px}
.credit{margin-top:auto;padding-top:24px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.6}.credit b{color:var(--text)}
.top{background:var(--primary);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px}.top small{opacity:.85;display:block;font-size:12px}
.top button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.content{padding:16px 16px 90px;flex:1;display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--primary);white-space:nowrap}
.pill.q{background:var(--warnbg);color:var(--warn)}.pill.ok{background:#dff3e7;color:#1f6b40}
.bar{height:9px;border-radius:6px;background:var(--border);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.low{background:var(--error)}
.big{font-size:32px;font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabbar{position:fixed;bottom:0;width:100%;max-width:420px;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar button{flex:1;min-width:0;border:0;background:none;padding:9px 2px 11px;font:inherit;font-size:10.5px;color:var(--muted);cursor:pointer;position:relative}
.tabbar button span{display:block;font-size:19px}.tabbar button.on{color:var(--primary);font-weight:600}
.badge{position:absolute;top:3px;left:55%;background:var(--error);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-style:normal}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}.tog:last-child{border:0}
.sw{width:44px;height:26px;border-radius:14px;background:var(--border);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--primary)}.sw.on::after{left:21px}
.chk{width:22px;height:22px}.empty{text-align:center;color:var(--muted);padding:26px 0;font-size:14px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;max-width:380px;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.loading{margin:auto;color:var(--muted)}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.5;margin:8px 0}
.file{display:inline-block;background:var(--soft);color:var(--primary);padding:6px 12px;border-radius:10px;font-size:13px;text-decoration:none;margin:4px 6px 4px 0;word-break:break-all}
.media{width:100%;border-radius:10px;margin:8px 0;background:#000;max-height:280px;object-fit:contain}
.avatar{object-fit:cover;width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;margin:0 auto 10px}
.sub-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--border);margin:12px 0}

.tabs2{overflow-x:auto}
.tabs2 button{white-space:nowrap;padding:10px 12px}
.att-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.att-row:last-child{border:0}
.seg{display:flex;gap:4px;flex:none}
.seg-b{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px;padding:7px 8px;font:inherit;font-size:12px;cursor:pointer}
.seg-b.on.P{background:#dff3e7;color:#1f6b40;border-color:#1f6b40;font-weight:600}
.seg-b.on.A{background:#fbe3e0;color:#a5281b;border-color:#a5281b;font-weight:600}
.seg-b.on.L{background:var(--warnbg);color:var(--warn);border-color:var(--warn);font-weight:600}
.pill.no{background:#fbe3e0;color:#a5281b}

/* Responsive layout: phone-first, with a wider workspace on tablets/desktops. */
html,body{min-height:100%;width:100%;overflow-x:hidden}
body{align-items:stretch}
#root{max-width:100%;width:100%;min-width:0}
.top{position:sticky;top:0;z-index:5}
.content{width:100%;min-width:0}
.card,.sub-box{min-width:0;overflow-wrap:anywhere}
.row{min-width:0;flex-wrap:wrap}
.row>*{min-width:0;max-width:100%}
button,input,select,textarea{max-width:100%}
.file{max-width:100%;overflow-wrap:anywhere}
.media{display:block}
.tabbar{left:0;right:0;margin:0 auto;max-width:100%;}
@media (min-width:700px){
  body{justify-content:center}
  #root{max-width:1100px;box-shadow:0 0 36px rgba(31,42,55,.08);min-height:100vh}
  .top{padding:18px 28px}
  .content{padding:24px 28px 110px}
  .pad{padding:34px 30px;max-width:620px;width:100%;margin:0 auto}
  .tabbar{max-width:1100px}
  .tabbar button{font-size:12px;padding:11px 8px 13px}
  .tabbar button span{font-size:21px}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:18px}
}
@media (min-width:1000px){
  .content{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:12px}
  .content>h2,.content>.empty,.content>.info,.content>.desc{grid-column:1/-1}
  .content>.card{margin-bottom:0}
  .content>.grid2{grid-column:1/-1}
}
@media (max-width:380px){
  .pad{padding:18px 14px}
  .content{padding:12px 10px 88px}
  .top{padding:12px}
  .top b{font-size:15px}
  .tabbar button{font-size:9.5px}
  .seg{flex-wrap:wrap}
}
</style>

<body>
<div id="root"><div class="loading">Loading…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

/* ============ SETTINGS ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBh5sDGrX8x7dPBUVoGaMM4CiCzYIHr6Lo",
  authDomain: "imcb-lms.firebaseapp.com",
  projectId: "imcb-lms",
  storageBucket: "imcb-lms.firebasestorage.app",
  messagingSenderId: "23711413398",
  appId: "1:23711413398:web:1b70bf7db60875a8fa7eb7"
};
// EmailJS (real OTP emails). No demo OTP is used.
const EMAILJS = { service: "service_eo4jaft", template: "template_38cdw9i", key: "wiTyd9NR8_DD3rLz3" };
// Cloudinary (file uploads: notes, pictures, videos, student Word files). Free, no card needed.
const CLOUDINARY = { cloud: "ntazp7sl", preset: "imcb_lms" };
const VERSION = 'v3.6';
const SUPERVISOR_LIMIT = 5;
const SCHOOL_CLASSES = ['Class 6','Class 7','Class 8','Class 9','Class 10'];
const YEAR_CLASSES = ['1st Year','2nd Year'];
const ALL_CLASSES = SCHOOL_CLASSES.concat(YEAR_CLASSES);
const SECTIONS = ['A','B','C'];
const needsSection = g => SCHOOL_CLASSES.includes(g);
const normSec = (g,sec) => needsSection(g) ? (sec||'') : '';
const classLabel = (g,sec) => g ? (g + (sec ? ' – Section '+sec : '')) : '';
const classKey = (g,sec) => String(g||'').replace(/\s+/g,'') + (sec ? '_'+sec : '');
const CLASS_LIST = [];
SCHOOL_CLASSES.forEach(g=>SECTIONS.forEach(sec=>CLASS_LIST.push({grade:g,section:sec,key:classKey(g,sec),label:classLabel(g,sec)})));
YEAR_CLASSES.forEach(g=>CLASS_LIST.push({grade:g,section:'',key:classKey(g,''),label:g}));
const ek = e => String(e||'').toLowerCase().replace(/\./g,',');   // safe key for e-mails inside a map
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const validRoll = r => /^[A-Za-z0-9-]{1,10}$/.test(r||'');
const classErr = (g,sec) => !ALL_CLASSES.includes(g) ? 'Please select a class.' : ((needsSection(g) && !SECTIONS.includes(sec)) ? 'Please select a section.' : null);
const cmpStudents = (a,b) => (ALL_CLASSES.indexOf(a.grade)-ALL_CLASSES.indexOf(b.grade)) || (a.section||'').localeCompare(b.section||'') || ((parseInt(a.roll,10)||1e9)-(parseInt(b.roll,10)||1e9)) || (a.name||'').localeCompare(b.name||'');
const TEACHER_LIMIT = 30;   // students are unlimited
const MAX_FILE_MB = 10, MAX_VIDEO_MB = 100;
/* ================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const functions = getFunctions(app);
const startLectureQuizCall = httpsCallable(functions, 'startLectureQuiz');
const submitLectureQuizCall = httpsCallable(functions, 'submitLectureQuiz');
let lectureQuizInterval = null;

const S = { screen:'loading', pick:null, role:null, mode:'login', err:'', msg:'', busy:false,
  me:null, tab:'home', tasks:[], notifs:[], materials:[], settings:{late:true,showAtt:true,timed:true},
  students:[], teachers:[], signed:new Set(), att:{}, subs:[], notifReads:{}, counters:{teachers:0}, unsubs:[], present:{},
  otp:null, otpAction:null, pending:null, needOtp:false, creating:false, age:null, grade:null, studentRequests:[], days:[], supervisors:[], work:null, attDate:null, editing:null, editingT:null,
  form:{type:'Assignment'}, files:{}, openTask:null, timedQuiz:null, working:false, notifFirst:true };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; };
const attr = s => esc(s).replace(/"/g,'&quot;');
const isGmail = e => /^[a-z0-9._%+-]+@gmail\.com$/i.test(e||'');
const pct = a => (!a||!a.t)?0:Math.round(a.p*100/a.t);
const ms = t => (t&&t.toMillis)?t.toMillis():Date.now();
const fmt = t => new Date(ms(t)).toLocaleString();
function fbMsg(e){
  const c=e.code||'';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)) return 'Incorrect Gmail or password.';
  if(c==='auth/email-already-in-use') return 'This Gmail is already registered. Please log in.';
  if(c==='auth/weak-password') return 'Password is too weak (minimum 6 characters).';
  if(c==='auth/too-many-requests') return 'Too many attempts. Please try again later.';
  if(c==='auth/network-request-failed') return 'No internet connection.';
  if(c==='permission-denied') return 'Permission denied. Please check the Firestore rules.';
  return e.message||'Something went wrong.';
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),4500); }
const credit = () => '<div class="credit"><b>Supervised by Atif Naeem Fayyaz</b><br><b>Created by IMCB Students</b><br>Credits: Syed Abdullah Shah, M.Talha Shahbaz,<br>Syed Hasaan, Touheed Hussnain, M.Ehtisam<br><span style="opacity:.7">IMCB LMS '+VERSION+'</span></div>';
const roleName = r => r==='supervisor'?'Supervisor':(r==='teacher'?'Teacher':'Student');
const brand = () => '<div class="brand"><img class="logo" src="icon-192.png" alt="IMCB Logo"><div><b>IMCB LMS</b><small>Islamabad Model College for Boys, Humak</small><small>Learning Management System</small></div></div>';
const go = s => { S.screen=s; S.err=''; S.msg=''; render(); };

/* form helpers: every input is stored in S.form so re-rendering never loses what the user typed */
const val = k => (S.form[k]===undefined||S.form[k]===null)?'':S.form[k];
const inp = (k,ph,type) => '<input type="'+(type||'text')+'" placeholder="'+attr(ph||'')+'" value="'+attr(val(k))+'" oninput="A.f(\''+k+'\',this.value)">';
const area = (k,ph,rows) => '<textarea rows="'+(rows||4)+'" placeholder="'+attr(ph||'')+'" oninput="A.f(\''+k+'\',this.value)">'+esc(val(k))+'</textarea>';
const fileIn = (k,accept) => '<input type="file" '+(accept?'accept="'+accept+'" ':'')+'onchange="A.pickFile(\''+k+'\',this)">'+(S.files[k]?'<div class="muted" style="margin-top:6px">Selected: '+esc(S.files[k].name)+' ('+(S.files[k].size/1048576).toFixed(1)+' MB)</div>':'');
const fileLink = (u,n) => u?'<a class="file" href="'+attr(u)+'" target="_blank" rel="noopener">📎 '+esc(n||'Open file')+'</a>':'';
const ainp = (k,ph,type,ac) => '<input type="'+(type||'text')+'" autocomplete="'+(ac||'off')+'" placeholder="'+attr(ph||'')+'" value="'+attr(val(k))+'" oninput="A.f(\''+k+'\',this.value)">';
function classSel(gk,sk){
  const g=val(gk), sec=val(sk);
  const options=S.me && S.me.role==='teacher' && ['taskGrade','materialGrade'].includes(gk) ? [S.me.grade].filter(Boolean) : ALL_CLASSES;
  let h='<label>Class</label><select onchange="A.setClass(\''+gk+'\',\''+sk+'\',this.value)"><option value="">Select class</option>'+options.map(c=>'<option value="'+c+'" '+(g===c?'selected':'')+'>'+c+'</option>').join('')+'</select>';
  if(needsSection(g)) h+='<label>Section</label><select onchange="A.f(\''+sk+'\',this.value)"><option value="">Select section</option>'+SECTIONS.map(x=>'<option value="'+x+'" '+(sec===x?'selected':'')+'>Section '+x+'</option>').join('')+'</select>';
  return h;
}
function subTabs(list,key){
  const cur=val(key)||list[0][0];
  return '<div class="tabs2">'+list.map(x=>'<button class="'+(cur===x[0]?'on':'')+'" onclick="A.sub(\''+key+'\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>';
}

/* ---------- file upload (Cloudinary) ---------- */
async function uploadFile(file){
  if(!CLOUDINARY.cloud || !CLOUDINARY.preset) throw new Error('File upload is not set up yet. Please add the Cloudinary settings.');
  const fd=new FormData(); fd.append('file',file); fd.append('upload_preset',CLOUDINARY.preset);
  const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY.cloud+'/auto/upload',{method:'POST',body:fd});
  if(!r.ok){ let m='Upload failed.'; try{ const j=await r.json(); if(j.error&&j.error.message) m='Upload failed: '+j.error.message; }catch(x){} throw new Error(m); }
  const j=await r.json();
  return { url:j.secure_url, name:file.name, kind:j.resource_type==='video'?'video':(j.resource_type==='image'?'image':'note') };
}

/* ---------- OTP (EmailJS) ---------- */
async function sendOtpMail(email){
  if(!EMAILJS.service || !EMAILJS.template || !EMAILJS.key){
    throw new Error('Real OTP email service is not configured.');
  }
  const a=new Uint32Array(1); crypto.getRandomValues(a);
  const code=String(100000 + (a[0] % 900000));
  const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:EMAILJS.service,template_id:EMAILJS.template,user_id:EMAILJS.key,template_params:{to_email:email,otp:code,email:email}})});
  if(!r.ok){
    let detail='';
    try{ const j=await r.json(); detail=j.text||j.error||''; }catch(e){}
    throw new Error('Could not send the OTP email. '+(detail?'EmailJS: '+detail:'Please check your EmailJS service/template settings.'));
  }
  S.otp={code, exp:Date.now()+600000, tries:0, sent:Date.now(), email};
}
function checkOtp(v){
  const o=S.otp;
  if(!o) return 'Please request a new OTP.';
  if(Date.now()>o.exp) return 'This OTP has expired. Please request a new one.';
  if(o.tries>=5) return 'Too many wrong attempts. Please request a new OTP.';
  if(v!==o.code){ o.tries++; return 'Wrong OTP. Please try again.'; }
  S.otp=null; return null;
}

/* ---------- render ---------- */
let dirty=false;
function refresh(){
  if(S.screen!=='app') return;
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ dirty=true; return; }  // do not disturb typing
  render();
}
document.addEventListener('focusout',()=>{ if(dirty){ dirty=false; setTimeout(()=>{ if(S.screen==='app') refresh(); },400); } });

function render(){
  const r=$('root'); let h=''; const s=S.screen;
  if(s==='loading') h='<div class="loading">Loading…</div>';
  else if(s==='role'){
    h='<div class="pad">'+brand()+'<div class="steps"><span class="on"></span><span></span><span></span></div>'+
    '<h1>Welcome!</h1><p class="sub">How would you like to log in?</p>'+
    '<button class="choice '+(S.pick==='teacher'?'sel':'')+'" onclick="A.pickRole(\'teacher\')"><span class="ic">👩‍🏫</span><span><b>Teacher</b><small>Manage courses, tasks and attendance</small></span></button>'+
    '<button class="choice '+(S.pick==='student'?'sel':'')+'" onclick="A.pickRole(\'student\')"><span class="ic">🧑‍🎓</span><span><b>Student</b><small>Courses, assignments and quizzes</small></span></button>'+
    '<button class="choice '+(S.pick==='supervisor'?'sel':'')+'" onclick="A.pickRole(\'supervisor\')"><span class="ic">🛡️</span><span><b>Supervisor</b><small>Full control of the whole LMS</small></span></button>'+
    '<button class="btn" '+(S.pick?'':'disabled')+' onclick="A.next()">Continue</button>'+credit()+'</div>';
  }
  else if(s==='age'){
    h='<div class="pad">'+brand()+'<div class="steps"><span class="on"></span><span class="on"></span><span></span></div>'+
    '<h1>Verify your age</h1><p class="sub">Enter your age to open the correct login screen.</p>'+

/* ---------- data helpers ---------- */
const T = id => S.tasks.find(t=>t.id===id);
const inMyClass = x => !x.grade || (x.grade===S.me.grade && (x.section||'')===(S.me.section||''));
const visibleTasks = () => S.me.role==='supervisor' ? S.tasks : S.tasks.filter(inMyClass);
const visibleMaterials = () => S.me.role==='supervisor' ? S.materials : S.materials.filter(inMyClass);
const myNotifs = () => S.notifs.filter(n=>{ if(n.to && n.to!==S.me.email) return false; if(S.me.role==='student' && n.grade && n.grade!==(S.me.grade||'')) return false; if(S.me.role==='student' && n.grade && SCHOOL_CLASSES.includes(n.grade) && (n.section||'')!==(S.me.section||'')) return false; return true; });
const isNotifRead = n => !!S.notifReads[n.id];
const unread = () => myNotifs().filter(n=>!isNotifRead(n)).length;
function attStats(email){
  let p=0,a=0,l=0; const k=ek(email);
  S.days.forEach(d=>{ const m=d.marks&&d.marks[k]; if(m==='P')p++; else if(m==='A')a++; else if(m==='L')l++; });
  const t=p+a+l;
  return {p,a,l,t,pct:t?Math.round(p*100/t):0};
}
function stats(email){
  const subs=S.subs.filter(x=>x.email===email);
  let m=0,t=0,graded=0;
  subs.forEach(x=>{ if(x.marks!=null){ const k=T(x.taskId); if(k&&k.totalMarks){ m+=x.marks; t+=k.totalMarks; graded++; } } });
  const a=attStats(email);
  return { avg:t?Math.round(m*100/t):null, submitted:subs.length, graded, att:a.pct, attRaw:{p:a.p,t:a.t,a:a.a,l:a.l} };
}
const avgTxt = a => a===null?'—':a+'%';

/* ---------- app shell ---------- */
function renderApp(){
  const role=S.me.role, t=role!=='student', sup=role==='supervisor';
  const tabs=sup?[['students','👥','People'],['att','📊','Attend.'],['profile','👤','Profile']]
    :t?[['home','🏠','Home'],['tasks','📝','Tasks'],['lib','📚','Library'],['att','📊','Attend.'],['students','👥','Students'],['profile','👤','Profile']]
      :[['home','🏠','Home'],['tasks','📝','Tasks'],['lib','📚','Library'],['progress','📈','Progress'],['alerts','🔔','Alerts'],['profile','👤','Profile']];
  if(!tabs.some(x=>x[0]===S.tab)) S.tab=tabs[0][0];
  let body='';
  switch(S.tab){
    case 'home': body=homeView(); break;
    case 'tasks': body=t?teacherTasks():studentTasks(); break;
    case 'lib': body=libraryView(); break;
    case 'att': body=teacherAtt(); break;
    case 'students': body=studentsView(); break;

}

/* ---------- Post-lecture timed quiz ---------- */
function renderTimedLectureQuiz(k){
  const tq=S.timedQuiz;
  if(!tq || tq.taskId!==k.id) return '';
  const i=tq.index, q=(k.questions||[])[i];
  if(!q) return '<div class="info">Submitting your timed quiz…</div>';
  const key='tq_'+k.id+'_'+i;
  return '<div class="sub-box"><div class="row"><b>Question '+(i+1)+' of '+k.questions.length+'</b><span class="pill q">'+tq.remaining+'s left</span></div>'+ 
    '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,tq.remaining))+'%"></i></div>'+ 
    '<div style="margin:14px 0"><b>'+esc(q.q)+'</b></div>'+['A','B','C','D'].map((letter,j)=>'<label style="display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:9px 0"><input class="chk" style="width:18px;height:18px;flex:none;margin-top:2px" type="radio" name="'+attr(key)+'" value="'+letter+'" '+(S.form[key]===letter?'checked':'')+' onchange="A.f(\''+attr(key)+'\',this.value)"><span><b>'+letter+'.</b> '+esc(q.options[j]||'')+'</span></label>').join('')+
    '<div class="muted">When the timer reaches zero, the next question opens automatically. Your quiz is submitted after the last question.</div>'+ 
    '<button class="btn" onclick="A.advanceTimedQuiz(\''+attr(k.id)+'\',false)">Submit answer & next</button></div>';
}
function stopLectureQuizTimer(){ if(lectureQuizInterval){ clearInterval(lectureQuizInterval); lectureQuizInterval=null; } }
function startLectureQuizTimer(){
  stopLectureQuizTimer();
  lectureQuizInterval=setInterval(()=>{
    if(!S.timedQuiz){ stopLectureQuizTimer(); return; }
    S.timedQuiz.remaining=Math.max(0,S.timedQuiz.remaining-1);
    if(S.timedQuiz.remaining===0) A.advanceTimedQuiz(S.timedQuiz.taskId,true);
    else render();
  },1000);
}

      '<div class="muted" style="margin:6px 0">'+esc(k.course)+' · '+esc(k.grade?classLabel(k.grade,k.section):'Legacy/global content')+' · '+k.totalMarks+' marks'+(k.due?' · Due '+esc(k.due):'')+'</div>'+

      h+='<hr class="sep">'+(sub?'<span class="pill ok">Submitted ✓</span> <span class="muted">You can edit until it is graded.</span> ':'')+
        '<button class="btn small" style="margin-top:6px" onclick="'+(k.type==='Lecture Quiz'?'A.startTimedQuiz(\''+k.id+'\')':'A.toggleTask(\''+k.id+'\')')+'">'+(k.type==='Lecture Quiz'?(S.timedQuiz&&S.timedQuiz.taskId===k.id?'Resume timed quiz':'Start timed quiz'):(open?'Close':(sub?'Edit submission':'Write / upload answer')))+'</button>';
      if(open){
        if(k.type==='Lecture Quiz' && S.timedQuiz && S.timedQuiz.taskId===k.id){ h+=renderTimedLectureQuiz(k); }

          h+='<div class="sub-box"><label style="margin-top:0">Your answer (write here)</label>'+area('ans_'+k.id,'Type your answer…',6)+

            (sub&&sub.fileUrl&&!S.files['ans_'+k.id]?'<div class="muted" style="margin-top:6px">Current file: '+fileLink(sub.fileUrl,sub.fileName)+'</div>':'')+
            '<button class="btn" style="margin-top:12px" '+(S.working?'disabled':'')+' onclick="A.submit(\''+k.id+'\')">'+(S.working?'Uploading…':(sub?'Update submission':'Submit'))+'</button></div>';
        }
      }

    return h+'</div>';
  }).join('');

    return '<div class="card"><div class="row"><b>'+icon+' '+esc(m.title)+'</b>'+(t?'<button class="btn small del" onclick="A.delMaterial(\''+m.id+'\')">Delete</button>':'')+'</div>'+
      '<div class="muted" style="margin:4px 0">'+esc(m.course||'')+' · '+fmt(m.createdAt)+'</div>'+
      (m.description?'<div class="desc">'+esc(m.description)+'</div>':'')+media+fileLink(m.url,m.kind==='note'?('Open / download '+(m.fileName||'file')):'Open in new tab')+quizButtons+'</div>';
  }).join('');
}

/* ---------- Attendance (teacher: own section, supervisor: any class) ---------- */
function attTarget(){
  if(S.me.role==='supervisor') return CLASS_LIST.find(c=>c.key===val('attKey'))||CLASS_LIST[0];
  if(!S.me.grade) return null;
  return {grade:S.me.grade,section:S.me.section||'',key:classKey(S.me.grade,S.me.section),label:classLabel(S.me.grade,S.me.section)};
}
function attStudents(t){ return S.students.filter(x=>x.grade===t.grade&&(x.section||'')===t.section).sort(cmpStudents); }
function teacherAtt(){
  const t=attTarget();
  if(!t) return '<div class="info">No class is assigned to your account yet. Please ask the supervisor to assign your class and section.</div>';
  const date=S.attDate||todayISO(), id=t.key+'_'+date, students=attStudents(t);
  const rec=S.days.find(d=>d.id===id);
  if(!S.work||S.work.id!==id) S.work={id,dirty:false,saved:!!rec,marks:rec?Object.assign({},rec.marks||{}):{},total:(rec&&rec.total)?rec.total:null};
  else if(!S.work.dirty && rec && !S.work.saved){ S.work.marks=Object.assign({},rec.marks||{}); S.work.total=rec.total||null; S.work.saved=true; }
  const w=S.work; let P=0,Ab=0,L=0;
  students.forEach(x=>{ const m=w.marks[ek(x.id)]||'P'; if(m==='P')P++; else if(m==='A')Ab++; else L++; });
  const total=w.total||students.length;
  let h='<h2 style="margin-top:4px">Attendance</h2>';
  if(S.me.role==='supervisor') h+='<label style="margin-top:0">Class</label><select onchange="A.setAttClass(this.value)">'+CLASS_LIST.map(c=>'<option value="'+c.key+'" '+(c.key===t.key?'selected':'')+'>'+esc(c.label)+'</option>').join('')+'</select>';
  else h+='<div class="muted">Your class: <b>'+esc(t.label)+'</b></div>';
  h+='<label>Date</label><input type="date" value="'+attr(date)+'" max="'+todayISO()+'" onchange="A.setDate(this.value)">';
  if(!students.length) return h+'<div class="empty">No approved students in this class yet.</div>';
  h+='<div class="card" style="margin-top:12px"><div class="grid2"><div><div class="muted">Total students (you can edit)</div><input type="number" min="1" value="'+total+'" oninput="A.setTotal(this.value)"></div>'+
    '<div><div class="muted">Students in app</div><div class="big">'+students.length+'</div></div></div>'+
    '<div class="row" style="margin-top:12px;justify-content:flex-start;flex-wrap:wrap"><span class="pill ok">Present: '+P+'</span><span class="pill no">Absent: '+Ab+'</span><span class="pill q">Leave: '+L+'</span></div>'+
    (rec?'<div class="muted" style="margin-top:8px">A record for this date is already saved. You are editing it.</div>':'')+'</div>';
  h+='<div class="card">'+students.map(x=>{
    const m=w.marks[ek(x.id)]||'P';
    return '<div class="att-row"><div><b>'+esc(x.name)+'</b><div class="muted">Roll '+esc(x.roll||'—')+'</div></div><div class="seg">'+
      [['P','Present'],['A','Absent'],['L','Leave']].map(o=>'<button class="seg-b '+(m===o[0]?'on '+o[0]:'')+'" onclick="A.mark(\''+x.id+'\',\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</div></div>';
  }).join('')+
    '<div class="row" style="margin-top:14px"><button class="btn small ghost" onclick="A.allPresent()">All present</button><button class="btn small" onclick="A.saveAtt()">'+(w.saved?'Update attendance':'Save attendance')+'</button></div></div>';
  h+='<h2>Attendance percentage</h2>';
  students.forEach(x=>{
    const a=attStats(x.id);
    h+='<div class="card"><div class="row"><b>'+esc(x.name)+' <span class="muted">(Roll '+esc(x.roll||'—')+')</span></b><b>'+a.pct+'%</b></div><div class="bar"><i class="'+(a.pct<75?'low':'')+'" style="width:'+a.pct+'%"></i></div>'+
      '<div class="muted" style="margin-top:6px">Present '+a.p+' · Absent '+a.a+' · Leave '+a.l+' · Days '+a.t+'</div></div>';
  });
  const recent=S.days.filter(d=>d.grade===t.grade&&(d.section||'')===t.section).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10);
  h+='<h2>Recent records</h2>'+(recent.length?recent.map(d=>{
    const c={P:0,A:0,L:0}; Object.values(d.marks||{}).forEach(v=>{ if(c[v]!==undefined) c[v]++; });
    return '<div class="card"><div class="row"><div><b>'+esc(d.date)+'</b><div class="muted">Present '+c.P+' · Absent '+c.A+' · Leave '+c.L+' · Total '+(d.total||'—')+'</div></div><button class="btn small ghost" onclick="A.openDay(\''+d.date+'\')">Edit</button></div></div>';
  }).join(''):'<div class="empty">No attendance saved yet.</div>');
  return h;
}

/* ---------- live data ---------- */
function unsubAll(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; S.notifFirst=true; }
function resetData(){
  S.tasks=[]; S.notifs=[]; S.materials=[]; S.students=[]; S.teachers=[]; S.supervisors=[]; S.signed=new Set(); S.subs=[];
  S.days=[]; S.studentRequests=[]; S.att={}; S.notifReads={}; S.counters={teachers:0}; S.work=null;
}
function subscribe(){
  unsubAll(); resetData();
  const role=S.me.role, sup=role==='supervisor', tch=role==='teacher', staff=role!=='student';
  const g=S.me.grade||null, sec=S.me.section||'';
  const on=(q,fn)=>S.unsubs.push(onSnapshot(q,fn,e=>console.warn(e)));
  const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  const mergeById=(a,b)=>Array.from(new Map([...a,...b].map(x=>[x.id,x])).values()).sort((x,y)=>ms(y.createdAt)-ms(x.createdAt));
  if(sup){
    on(query(collection(db,'tasks'),orderBy('createdAt','desc')), s=>{ S.tasks=list(s); refresh(); });
    on(query(collection(db,'materials'),orderBy('createdAt','desc')), s=>{ S.materials=list(s); refresh(); });
  } else if(g){
    on(query(collection(db,'tasks'),where('grade','==',g),where('section','==',sec),orderBy('createdAt','desc')), s=>{ S.tasks=mergeById(S.tasks.filter(x=>x.createdBy===S.me.uid),list(s)); refresh(); });
    on(query(collection(db,'materials'),where('grade','==',g),where('section','==',sec),orderBy('createdAt','desc')), s=>{ S.materials=mergeById(S.materials.filter(x=>x.createdBy===S.me.uid),list(s)); refresh(); });
    if(tch){
      on(query(collection(db,'tasks'),where('createdBy','==',S.me.uid)), s=>{ S.tasks=mergeById(S.tasks.filter(x=>x.grade===g&&x.section===sec),list(s)); refresh(); });
      on(query(collection(db,'materials'),where('createdBy','==',S.me.uid)), s=>{ S.materials=mergeById(S.materials.filter(x=>x.grade===g&&x.section===sec),list(s)); refresh(); });
    }
  } else { S.tasks=[]; S.materials=[]; }
  on(collection(db,'users',S.me.uid,'notificationReads'), s=>{ S.notifReads=Object.fromEntries(s.docs.map(d=>[d.id,true])); refresh(); });
  on(query(collection(db,'notifications'),orderBy('createdAt','desc'),limit(60)), s=>{
    if(!S.notifFirst && !staff) s.docChanges().forEach(c=>{ if(c.type==='added'){ const n=c.doc.data(); if((!n.to||n.to===S.me.email) && (!n.grade || (n.grade===S.me.grade && (!SCHOOL_CLASSES.includes(n.grade) || (n.section||'')===(S.me.section||''))))) toast('🔔 '+n.text); } });
    S.notifFirst=false; S.notifs=list(s); refresh();
  });
  on(doc(db,'settings','course'), s=>{ S.settings={late:true,showAtt:true,timed:true,...(s.data()||{})}; refresh(); });
  on(doc(db,'meta','counters'), s=>{ S.counters=s.data()||{teachers:0}; refresh(); });
  if(sup){
    on(collection(db,'roster'), s=>{ S.students=list(s).sort(cmpStudents); refresh(); });
    on(query(collection(db,'users'),where('role','==','student')), s=>{ S.signed=new Set(s.docs.map(d=>d.data().email)); refresh(); });
    on(query(collection(db,'users'),where('role','==','teacher')), s=>{ S.teachers=list(s).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); refresh(); });
    on(query(collection(db,'users'),where('role','==','supervisor')), s=>{ S.supervisors=list(s).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); refresh(); });
    on(query(collection(db,'studentRequests'),where('status','==','pending')), s=>{ S.studentRequests=list(s).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)); refresh(); });
    on(collection(db,'attendanceDays'), s=>{ S.days=list(s); refresh(); });
    on(collection(db,'submissions'), s=>{ S.subs=list(s); refresh(); });
  } else if(tch){
    if(g){
      const cls=[where('grade','==',g),where('section','==',sec)];
      on(query(collection(db,'roster'),...cls), s=>{ S.students=list(s).sort(cmpStudents); refresh(); });
      on(query(collection(db,'users'),where('role','==','student'),...cls), s=>{ S.signed=new Set(s.docs.map(d=>d.data().email)); refresh(); });
      on(query(collection(db,'studentRequests'),where('status','==','pending'),...cls), s=>{ S.studentRequests=list(s).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)); refresh(); });
      on(query(collection(db,'attendanceDays'),...cls), s=>{ S.days=list(s); refresh(); });
    }
    if(g) on(query(collection(db,'submissions'),where('grade','==',g),where('section','==',sec)), s=>{ S.subs=list(s); refresh(); });
  } else {
    if(g) on(query(collection(db,'attendanceDays'),where('grade','==',g),where('section','==',sec)), s=>{ S.days=list(s); refresh(); });
    on(query(collection(db,'submissions'),where('uid','==',S.me.uid)), s=>{ S.subs=list(s); refresh(); });
  }
}

async function createManagedAuthAccount(email,password){
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+encodeURIComponent(firebaseConfig.apiKey),{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.error&&j.error.message==='EMAIL_EXISTS'?'This Gmail is already registered.':(j.error&&j.error.message||'Could not create the account.'));
  return {uid:j.localId,idToken:j.idToken};
}
async function deleteManagedAuthAccount(idToken){

    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken})
  }); }catch(e){}
}

    const ce=classErr(grade,section); if(ce){ er.textContent=ce; return; } section=normSec(grade,section);
    if(S.teachers.some(x=>x.email===email)){ er.textContent='This teacher is already added.'; return; }
    if((S.counters.teachers||0)>=TEACHER_LIMIT){ er.textContent='Teacher limit reached ('+TEACHER_LIMIT+').'; return; }
    S.working=true; render();
    let created=null;
    try{
      created=await createManagedAuthAccount(email,pw);
      await runTransaction(db,async tx=>{
        const cRef=doc(db,'meta','counters'); const c=await tx.get(cRef); const n=c.exists()?(c.data().teachers||0):0;
        if(n>=TEACHER_LIMIT) throw new Error('Teacher limit reached ('+TEACHER_LIMIT+'/'+TEACHER_LIMIT+').');
        tx.set(cRef,{teachers:n+1},{merge:true});
        tx.set(doc(db,'users',created.uid),{name,email,role:'teacher',grade,section,createdAt:serverTimestamp()});
      });
      ['t_name','t_email','t_pw','t_grade','t_section'].forEach(k=>delete S.form[k]);
      toast('Teacher account created.');
    }catch(e){
      if(created) await deleteManagedAuthAccount(created.idToken);
      toast(fbMsg(e));
    }
    S.working=false; render();
  },
  async approveSupervisor(id){
    if(S.me.role!=='supervisor') return;
    const req=S.studentRequests.find(x=>x.id===id && x.requestType==='supervisor'); if(!req) return;
    if(S.supervisors.length>=SUPERVISOR_LIMIT){ toast('Supervisor limit reached ('+SUPERVISOR_LIMIT+').'); return; }
    try{
      await runTransaction(db,async tx=>{
        const rRef=doc(db,'studentRequests',id), r=await tx.get(rRef);
        if(!r.exists() || r.data().status!=='pending' || r.data().requestType!=='supervisor') throw new Error('This supervisor request has already been processed.');
        const d=r.data();
        const cRef=doc(db,'meta','supervisorCount'), c=await tx.get(cRef), n=c.exists()?(c.data().extra||0):0;
        if(n>=SUPERVISOR_LIMIT-1) throw new Error('Supervisor limit reached ('+SUPERVISOR_LIMIT+').');
        tx.set(doc(db,'users',d.uid),{name:d.name,email:d.email,role:'supervisor',createdAt:serverTimestamp()});
        tx.set(cRef,{extra:n+1},{merge:true});
        tx.update(rRef,{status:'approved',approvedBy:S.me.uid,approvedByName:S.me.name,approvedAt:serverTimestamp()});
        tx.set(doc(collection(db,'notifications')),{text:'Your supervisor signup was approved by '+S.me.name+'. You can now log in.',to:d.email,createdAt:serverTimestamp(),by:S.me.name});
      });
      toast('Supervisor approved.');
    }catch(e){ toast(fbMsg(e)); }
  },
  async rejectSupervisor(id){
    if(S.me.role!=='supervisor') return;
    const req=S.studentRequests.find(x=>x.id===id && x.requestType==='supervisor'); if(!req) return;
    if(!confirm('Reject supervisor signup for '+req.name+'?')) return;
    try{
      await runTransaction(db,async tx=>{
        const rRef=doc(db,'studentRequests',id), r=await tx.get(rRef);
        if(!r.exists() || r.data().status!=='pending' || r.data().requestType!=='supervisor') throw new Error('This supervisor request has already been processed.');
        const d=r.data();
        tx.update(rRef,{status:'rejected',rejectedBy:S.me.uid,rejectedByName:S.me.name,rejectedAt:serverTimestamp()});
        tx.set(doc(collection(db,'notifications')),{text:'Your supervisor signup was rejected by '+S.me.name+'. Please contact an existing supervisor for more information.',to:d.email,createdAt:serverTimestamp(),by:S.me.name});
      });
      toast('Supervisor request rejected.');
    }catch(e){ toast(fbMsg(e)); }
  },
  async approveStudent(id){
    if(S.me.role==='student') return;
    const req=S.studentRequests.find(x=>x.id===id); if(!req) return;
    if(S.students.some(z=>z.grade===req.grade&&(z.section||'')===(req.section||'')&&String(z.roll)===String(req.roll))){
      toast('Roll number '+req.roll+' is already used in '+classLabel(req.grade,req.section)+'. Please check before approving.'); return;
    }
    try{
      await runTransaction(db,async tx=>{
        const rRef=doc(db,'studentRequests',id), r=await tx.get(rRef);
        if(!r.exists() || r.data().status!=='pending') throw new Error('This request has already been processed.');
        const d=r.data();
        tx.set(doc(db,'roster',d.email),{name:d.name,email:d.email,grade:d.grade,section:d.section,roll:d.roll,uid:d.uid,addedBy:S.me.name,createdAt:serverTimestamp()});
        tx.set(doc(db,'users',d.uid),{name:d.name,email:d.email,role:'student',grade:d.grade,section:d.section,roll:d.roll,createdAt:serverTimestamp()});
        tx.update(rRef,{status:'approved',approvedBy:S.me.uid,approvedByName:S.me.name,approvedAt:serverTimestamp()});
        tx.set(doc(collection(db,'notifications')),{text:'Your signup was approved by '+S.me.name+'. Welcome to IMCB LMS!',to:d.email,createdAt:serverTimestamp(),by:S.me.name});
      });
      toast('Student approved.');
    }catch(e){ toast(fbMsg(e)); }
  },
  async rejectStudent(id){
    if(S.me.role==='student') return;
    const req=S.studentRequests.find(x=>x.id===id); if(!req) return;
    if(!confirm('Reject '+req.name+'?')) return;
    try{
      await runTransaction(db,async tx=>{
        const rRef=doc(db,'studentRequests',id), r=await tx.get(rRef);
        if(!r.exists() || r.data().status!=='pending') throw new Error('This request has already been processed.');
        const d=r.data();
        tx.update(rRef,{status:'rejected',rejectedBy:S.me.uid,rejectedByName:S.me.name,rejectedAt:serverTimestamp()});
        tx.set(doc(collection(db,'notifications')),{text:'Your signup was rejected by '+S.me.name+'. Please contact your class teacher for more information.',to:d.email,createdAt:serverTimestamp(),by:S.me.name});
      });
      toast('Student request rejected.');
    }catch(e){ toast(fbMsg(e)); }
  },
  async removeTeacher(uid){
    const x=S.teachers.find(z=>z.id===uid);
    if(!confirm('Remove teacher '+(x?x.name:'')+'? They will lose access immediately.')) return;
    try{
      const b=writeBatch(db); b.delete(doc(db,'users',uid)); b.set(doc(db,'meta','counters'),{teachers:increment(-1)},{merge:true}); await b.commit();
      toast('Teacher removed.');
    }catch(e){ toast(fbMsg(e)); }
  },
  setDate(v){ if(!v) return; S.attDate=v; S.work=null; render(); },
  setAttClass(v){ S.form.attKey=v; S.work=null; render(); },
  mark(email,v){ if(!S.work) return; S.work.marks[ek(email)]=v; S.work.dirty=true; render(); },
  allPresent(){ const t=attTarget(); if(!t||!S.work) return; attStudents(t).forEach(x=>{ S.work.marks[ek(x.id)]='P'; }); S.work.dirty=true; render(); },
  setTotal(v){ if(!S.work) return; S.work.total=(v===''?null:Math.max(1,Math.floor(Number(v))||1)); S.work.dirty=true; },
  openDay(d){ S.attDate=d; S.work=null; render(); window.scrollTo(0,0); },
  async saveAtt(){
    const t=attTarget(); if(!t||!S.work) return;
    const students=attStudents(t); if(!students.length){ toast('No students to mark.'); return; }
    const date=S.attDate||todayISO(), marks={};
    students.forEach(x=>{ marks[ek(x.id)]=S.work.marks[ek(x.id)]||'P'; });
    const total=S.work.total||students.length;
    try{
      await setDoc(doc(db,'attendanceDays',t.key+'_'+date),{grade:t.grade,section:t.section,date,marks,total,by:S.me.name,updatedAt:serverTimestamp()});
      S.work.dirty=false; S.work.saved=true; toast('Attendance saved for '+date+'.'); render();
    }catch(e){ toast(fbMsg(e)); }
  },
  sub(k,v){ S.form[k]=v; render(); },
  setClass(gk,sk,v){ S.form[gk]=v; S.form[sk]=''; render(); },
  editStudent(id){
    const x=S.students.find(z=>z.id===id); if(!x) return;
    S.editing=id; S.form.e_name=x.name||''; S.form.e_roll=x.roll||''; S.form.e_grade=x.grade||''; S.form.e_section=x.section||''; render();
  },
  cancelEdit(){ S.editing=null; render(); },
  async saveStudent(id){
    const x=S.students.find(z=>z.id===id); if(!x) return;
    const sup=S.me.role==='supervisor', er=$('eerr');
    const name=val('e_name').trim(), roll=val('e_roll').trim();
    if(name.length<2){ er.textContent='Please enter the student name.'; return; }
    if(!validRoll(roll)){ er.textContent='Please enter a valid roll number.'; return; }
    let grade=x.grade||'', section=x.section||'';
    if(sup){ grade=val('e_grade'); section=val('e_section'); const ce=classErr(grade,section); if(ce){ er.textContent=ce; return; } section=normSec(grade,section); }
    if(S.students.some(z=>z.id!==id&&z.grade===grade&&(z.section||'')===section&&String(z.roll)===roll)){ er.textContent='This roll number is already used in '+classLabel(grade,section)+'.'; return; }
    try{
      const data=sup?{name,roll,grade,section}:{name,roll};
      const b=writeBatch(db);
      b.update(doc(db,'roster',id),data);
      if(x.uid) b.update(doc(db,'users',x.uid),data);
      await b.commit(); S.editing=null; toast('Student updated.'); render();
    }catch(e){ er.textContent=fbMsg(e); }
  },
  editTeacher(uid){
    const x=S.teachers.find(z=>z.id===uid); if(!x) return;
    S.editingT=uid; S.form.et_name=x.name||''; S.form.et_grade=x.grade||''; S.form.et_section=x.section||''; render();
  },
  cancelEditT(){ S.editingT=null; render(); },
  async saveTeacher(uid){
    const name=val('et_name').trim(), grade=val('et_grade'); let section=val('et_section'); const er=$('eterr');
    if(name.length<2){ er.textContent='Please enter the teacher name.'; return; }
    const ce=classErr(grade,section); if(ce){ er.textContent=ce; return; } section=normSec(grade,section);
    try{ await updateDoc(doc(db,'users',uid),{name,grade,section}); S.editingT=null; toast('Teacher updated.'); render(); }
    catch(e){ er.textContent=fbMsg(e); }
  },
  async addSupervisor(){
    if(S.me.role!=='supervisor'){ toast('Only a supervisor can add supervisors.'); return; }
    const name=val('s_name').trim(), email=val('s_email').trim().toLowerCase(), pw=val('s_pw'), er=$('serr2');
    if(name.length<2){ er.textContent='Please enter the supervisor name.'; return; }
    if(!isGmail(email)){ er.textContent='Please enter a valid Gmail address.'; return; }
    if(pw.length<6){ er.textContent='Password must be at least 6 characters.'; return; }
    if(S.supervisors.length>=SUPERVISOR_LIMIT){ er.textContent='Supervisor limit reached ('+SUPERVISOR_LIMIT+').'; return; }
    S.working=true; render();
    let created=null;
    try{
      created=await createManagedAuthAccount(email,pw);
      await runTransaction(db,async tx=>{
        const cRef=doc(db,'meta','supervisorCount'), c=await tx.get(cRef), n=c.exists()?(c.data().extra||0):0;
        if(n>=SUPERVISOR_LIMIT-1) throw new Error('Supervisor limit reached ('+SUPERVISOR_LIMIT+').');
        tx.set(cRef,{extra:n+1});
        tx.set(doc(db,'users',created.uid),{name,email,role:'supervisor',createdAt:serverTimestamp()});
      });
      ['s_name','s_email','s_pw'].forEach(k=>delete S.form[k]);
      toast('Supervisor account created.');
    }catch(e){
      if(created) await deleteManagedAuthAccount(created.idToken);
      toast(fbMsg(e));
    }
    S.working=false; render();
  },
  async toggle(k){
    const v=!S.settings[k];
    try{ await setDoc(doc(db,'settings','course'),{[k]:v},{merge:true}); await notify('Setting updated: '+LABELS[k]+' is now '+(v?'ON':'OFF')); }catch(e){ toast(fbMsg(e)); }
  },

  /* student: submit answer (text and/or Word file) */
  async submit(taskId){
    const text=(S.form['ans_'+taskId]||'').trim(), f=S.files['ans_'+taskId], old=S.subs.find(x=>x.taskId===taskId);
    if(!text && !f && !(old&&old.fileUrl)){ toast('Please write your answer or upload a file.'); return; }
    S.working=true; render();
    try{
      const task=T(taskId); const data={taskId,uid:S.me.uid,email:S.me.email,name:S.me.name,grade:task?task.grade:(S.me.grade||''),section:task?(task.section||''):(S.me.section||''),text,at:serverTimestamp()};
      if(f){ const up=await uploadFile(f); data.fileUrl=up.url; data.fileName=up.name; }
      else if(old&&old.fileUrl){ data.fileUrl=old.fileUrl; data.fileName=old.fileName; }
      await setDoc(doc(db,'submissions',taskId+'_'+S.me.uid),data);
      delete S.files['ans_'+taskId]; S.openTask=null;
      toast('Submitted successfully.');
    }catch(e){ toast(fbMsg(e)); }
    S.working=false; render();
  }
};

/* ---------- start ---------- */
onAuthStateChanged(auth, async user=>{
  if(S.needOtp || S.creating) return;               // login/signup flow in progress
  if(!user){ if(S.screen==='loading'||S.screen==='app') go('role'); return; }
  if(localStorage.getItem('otpPending')==='1'){ await signOut(auth); localStorage.removeItem('otpPending'); go('role'); return; }
  if(!S.me) await startApp(user);
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
render();
</script>
